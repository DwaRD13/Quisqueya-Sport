<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="gigBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b1126"/>
      <stop offset="100%" stop-color="#3b0612"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="48" fill="url(#gigBg)"/>
  <circle cx="150" cy="150" r="124" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="150" cy="150" r="112" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  <!-- Stylized G Emblem -->
  <text x="150" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="138" font-weight="900" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="5">G</text>
  <!-- Ribbon Banner -->
  <rect x="34" y="205" width="232" height="38" rx="8" fill="url(#goldGrad)" stroke="#3b0612" stroke-width="3"/>
  <text x="150" y="230" text-anchor="middle" font-family="Roboto Condensed, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="2" fill="#3b0612">GIGANTES DEL CIBAO</text>
</svg>
